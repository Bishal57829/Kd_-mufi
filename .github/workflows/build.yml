name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unzip project
        run: unzip -q kd-mobile-project.zip
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      - name: Install buildozer
        run: pip install buildozer cython==0.29.36
      - name: Prepare Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          S=~/.buildozer/android/platform/android-sdk
          mkdir -p $S/build-tools
          cp -r $ANDROID_HOME/licenses $S/licenses
          cp -r $ANDROID_HOME/build-tools/34.0.0 $S/build-tools/34.0.0
      - name: Build
        run: cd kd-mobile && buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: kd-mobile-apk
          path: kd-mobile/bin/*.apk
